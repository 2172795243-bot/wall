name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk           autoconf libtool pkg-config zlib1g-dev libncurses-dev           cmake libffi-dev libssl-dev

    - name: install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: build apk
      env:
        BUILDOZER_WARN_ON_ROOT: 0
      run: |
        buildozer -v android debug

    - name: upload apk
      uses: actions/upload-artifact@v4
      with:
        name: python-crawler-apk
        path: bin/*.apk
        if-no-files-found: error
        retention-days: 30
